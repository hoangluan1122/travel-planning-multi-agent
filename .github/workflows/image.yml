# Builds travelmate/Dockerfile and publishes it as ghcr.io/hoangluan1122/travelmate:latest after CI
# passes on main. The AWS EC2 server (deploy/aws) pulls this image every 5 minutes; Render keeps
# building its own copy from main, so the two sites stay on the same commit.
name: Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  publish:
    name: Publish image
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: travelmate
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/hoangluan1122/travelmate:latest
            ghcr.io/hoangluan1122/travelmate:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
