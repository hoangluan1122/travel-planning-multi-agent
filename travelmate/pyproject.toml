[project]
name = "travelmate"
version = "0.1.0"
description = "TravelMate multi-agent planning backend"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
ai = ["google-adk>=1.18,<2"]
browser = ["playwright>=1.48,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

